name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python Embedding Service ─────────────────────────────────────────────
  python-tests:
    name: Python — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embedding_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff mypy

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type-check (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Run tests
        env:
          DATABASE_URL: postgresql://travel:test@localhost:5432/travel_concierge
        run: pytest tests/ -v --tb=short

  # ── Node.js API Gateway ──────────────────────────────────────────────────
  node-tests:
    name: Node.js — lint, typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api_gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api_gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: sk-ant-test-key
        run: npm test

  # ── Docker build smoke-test ──────────────────────────────────────────────
  docker-build:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [python-tests, node-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Build embedding service image
        run: docker build -t travel-embedding:ci ./embedding_service

      - name: Build API gateway image
        run: docker build -t travel-gateway:ci ./api_gateway
