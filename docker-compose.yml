version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: travel_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_concierge}
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel} -d ${POSTGRES_DB:-travel_concierge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding_service:
    build:
      context: ./embedding_service
      dockerfile: Dockerfile
    container_name: travel_embedding
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-travel_concierge}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: travel_gateway
    env_file: .env
    environment:
      EMBEDDING_SERVICE_URL: http://embedding_service:8001
    ports:
      - "8000:8000"
    depends_on:
      embedding_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travel_frontend
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api_gateway:
        condition: service_healthy

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    container_name: travel_docs
    ports:
      - "4000:80"

volumes:
  postgres_data:
